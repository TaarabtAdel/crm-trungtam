# docker compose up --build
# App:        http://localhost:8082
# phpMyAdmin: http://localhost:8083  (root / secret)
# MySQL:      localhost:3307

name: crm_trungtam

services:
  app:
    build: .
    container_name: crmtt_app
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8082
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-crm_trungtam}
      DB_USERNAME: root
      DB_PASSWORD: secret
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: crmtt_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-crm_trungtam}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: crmtt_phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: crm_trungtam_mysql_data
